name: CI

on:
  pull_request:
  push:
    branches: [main, release/rln-0.15.0-beta.3]

permissions:
  contents: read

jobs:
  android-staging-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.3.1'
      - run: gradle -p tests/android-gradle --offline --no-daemon :app:mergeReleaseNativeLibs

  contract:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RLN_BARE_TARGETS: darwin-arm64
      RLN_BARE_DEBUG: '1'
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          rustflags: ''
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check:types
      - run: npm run test:installer
      - name: Build pinned graph and verify provenance
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: node scripts/with-source-access.js npm run prepare-native
      - name: Real native canary including invalid handle tests
        run: npm test
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bare-contract-${{ github.sha }}
          path: |
            *.tgz
            .utexo-native-overlay.json
          include-hidden-files: true
          if-no-files-found: error
