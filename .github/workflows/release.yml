name: Build Candidate Artifacts (No Publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, ios-arm64, ios-arm64-simulator, ios-x64-simulator, android-arm64, android-arm, android-x64]
    env:
      RLN_BARE_TARGETS: ${{ matrix.platform }}
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          rustflags: ''
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check:types
      - run: npm run test:installer
      - name: Install pinned NDK
        if: startsWith(matrix.platform, 'android-')
        run: echo "ANDROID_NDK_HOME=$(bash scripts/install-android-ndk.sh)" >> "$GITHUB_ENV"
      - name: Build exact release source, verify header and ABI
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: node scripts/with-source-access.js npm run prepare-native
      - name: Desktop runtime canary
        if: matrix.platform == 'darwin-arm64'
        run: node node_modules/bare-runtime/bin/bare test.js
      - name: Stage and validate Android production packaging
        id: android-packaging
        if: startsWith(matrix.platform, 'android-')
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          npm install --prefix "$RUNNER_TEMP/android-link" --ignore-scripts --no-audit --no-fund bare-link@3.3.2 bare-lief@0.2.10
          node "$RUNNER_TEMP/android-link/node_modules/bare-link/bin.js" . --host "$TARGET" --out "$RUNNER_TEMP/linked-android"
          case "$TARGET" in android-arm64) ABI=arm64-v8a;; android-arm) ABI=armeabi-v7a;; android-x64) ABI=x86_64;; *) exit 1;; esac
          mkdir "$RUNNER_TEMP/bare-kit-runtime"
          npm pack react-native-bare-kit@0.15.5 --ignore-scripts --pack-destination "$RUNNER_TEMP/bare-kit-runtime"
          tar -xzf "$RUNNER_TEMP/bare-kit-runtime/react-native-bare-kit-0.15.5.tgz" -C "$RUNNER_TEMP/bare-kit-runtime"
          node scripts/stage-android-addons.js \
            --bare-kit "$RUNNER_TEMP/bare-kit-runtime/package" \
            --linked-dir "$RUNNER_TEMP/linked-android" \
            --out "$RUNNER_TEMP/staged-android" --abis "$ABI"
          VERSION=$(node -p 'require("./package.json").version')
          export LLVM_READOBJ="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readobj"
          if [ "$TARGET" != android-arm ]; then
            node scripts/check-android-linked.js "$TARGET" "$RUNNER_TEMP/staged-android/$ABI/libutexo__rgb-lightning-node-bare.$VERSION.so"
          fi
      - name: Mobile qualification restriction
        if: matrix.platform != 'darwin-arm64'
        run: echo 'Compile-only. Device/emulator runtime qualification remains a release gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bare-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lib/${{ matrix.platform }}/librlncffi.a
            .utexo-native-overlay.json
            prebuilds/${{ matrix.platform }}/utexo__rgb-lightning-node-bare.bare
          if-no-files-found: error
          include-hidden-files: true
      - name: Retain verified Android staging separately
        if: startsWith(matrix.platform, 'android-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bare-staged-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/staged-android/
          if-no-files-found: error
      - name: Retain rejected Android packaging for diagnosis
        if: failure() && steps.android-packaging.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-android-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .utexo-native-overlay.json
            prebuilds/${{ matrix.platform }}/utexo__rgb-lightning-node-bare.bare
            ${{ runner.temp }}/linked-android/
          include-hidden-files: true
          if-no-files-found: error
