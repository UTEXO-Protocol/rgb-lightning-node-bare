name: Build Candidate Artifacts (No Publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, ios-arm64, ios-arm64-simulator, ios-x64-simulator, android-arm64, android-arm, android-x64]
    env:
      RLN_BARE_TARGETS: ${{ matrix.platform }}
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          rustflags: ''
      - run: npm ci --ignore-scripts
      - run: npm run check:types
      - run: npm run test:installer
      - name: Install pinned NDK
        if: startsWith(matrix.platform, 'android-')
        run: echo "ANDROID_NDK_HOME=$(bash scripts/install-android-ndk.sh)" >> "$GITHUB_ENV"
      - name: Build exact release source, verify header and ABI
        run: npm run prepare-native
      - name: Desktop runtime canary
        if: matrix.platform == 'darwin-arm64'
        run: node node_modules/bare-runtime/bin/bare test.js
      - name: Validate Android ELF after production packaging
        if: matrix.platform == 'android-arm64' || matrix.platform == 'android-x64'
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          npm install --prefix "$RUNNER_TEMP/android-link" --ignore-scripts --no-audit --no-fund bare-link@3.3.0 bare-lief@0.2.8
          node "$RUNNER_TEMP/android-link/node_modules/bare-link/bin.js" . --host "$TARGET" --out "$RUNNER_TEMP/linked-android"
          if [ "$TARGET" = android-arm64 ]; then ABI=arm64-v8a; else ABI=x86_64; fi
          VERSION=$(node -p 'require("./package.json").version')
          export LLVM_READOBJ="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-readobj"
          node scripts/check-android-linked.js "$TARGET" "$RUNNER_TEMP/linked-android/$ABI/libutexo__rgb-lightning-node-bare.$VERSION.so"
      - name: Mobile qualification restriction
        if: matrix.platform != 'darwin-arm64'
        run: echo 'Compile-only. Device/emulator runtime qualification remains a release gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bare-${{ matrix.platform }}-${{ github.sha }}
          path: |
            lib/${{ matrix.platform }}/librlncffi.a
            .utexo-native-overlay.json
            prebuilds/${{ matrix.platform }}/utexo__rgb-lightning-node-bare.bare
          if-no-files-found: error
          include-hidden-files: true
